<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Order progress · Mesa Tica</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/tracking.js"></script>
</head>
<body>
  <header class="site-header"><div class="shell"><a class="brand" href="/">Mesa Tica</a><span>Pickup ordering</span></div></header>
  <main class="shell">
    <section class="panel narrow" aria-labelledby="tracking-heading">
      <p class="eyebrow">Private tracking</p>
      <h1 id="tracking-heading">Order progress</h1>
      <p id="tracking-warning" class="notice" role="status" hidden></p>
      <div id="tracking-content"><p role="status">Checking your order…</p></div>
      <p id="checked" class="small" hidden></p>
      <p class="small">Keep this link private. Anyone with the link can view this order.</p>
      <p class="small">Contact restaurant staff about changes or cancellation.</p>
      <a class="button text" href="/">Back to menu</a>
    </section>
  </main>
  <footer class="shell site-footer">Mesa Tica pickup counter · Fictional restaurant</footer>
</body>
</html>
